<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    name="description"
    content="View a playlist shared from the PlayList app."
  />

  <title>Shared PlayList</title>

  <style>
    :root {
      color-scheme: light;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #202020;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
    }

    header {
      background: #121212;
      color: white;
      padding:
        max(32px, env(safe-area-inset-top))
        20px
        32px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
    }

    header p {
      margin: 10px 0 0;
      color: #bdbdbd;
      font-size: 1rem;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .playlist-header {
      margin-bottom: 24px;
    }

    .playlist-header h2 {
      margin: 0;
      font-size: clamp(1.75rem, 6vw, 2.4rem);
      overflow-wrap: anywhere;
    }

    .playlist-header p {
      margin: 8px 0 0;
      color: #666;
    }

    .status {
      background: white;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      color: #666;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }

    .status.error {
      color: #a32222;
      background: #fff2f2;
    }

    .playlist-list {
      display: grid;
      gap: 14px;
    }

    .media-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 96px;
      padding: 12px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .artwork,
    .artwork-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 12px;
    }

    .artwork {
      display: block;
      object-fit: cover;
      background: #e6e6e6;
    }

    .artwork-placeholder {
      display: grid;
      place-items: center;
      background: #e8f8ee;
      color: #168a43;
      font-size: 1.6rem;
      font-weight: 700;
    }

    .media-details {
      min-width: 0;
    }

    .media-title {
      margin: 0;
      color: #292929;
      font-size: 1rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .media-creator {
      margin: 5px 0 0;
      color: #777;
      font-size: 0.9rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .media-type {
      display: inline-block;
      margin-top: 7px;
      color: #168a43;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: #1db954;
      color: white;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .open-link:hover,
    .open-link:focus-visible {
      background: #159447;
    }

    .unavailable {
      color: #999;
      font-size: 0.8rem;
      text-align: right;
    }

    footer {
      padding: 8px 20px max(24px, env(safe-area-inset-bottom));
      color: #777;
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 520px) {
      main {
        width: min(100% - 20px, 760px);
        padding-top: 22px;
      }

      .media-card {
        grid-template-columns: 60px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px;
      }

      .artwork,
      .artwork-placeholder {
        width: 60px;
        height: 60px;
        border-radius: 10px;
      }

      .open-link {
        width: 42px;
        min-height: 42px;
        padding: 0;
        font-size: 0;
      }

      .open-link::after {
        content: "↗";
        font-size: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>PlayList</h1>
    <p>A shared multimedia playlist</p>
  </header>

  <main>
    <section
      id="playlistHeader"
      class="playlist-header"
      hidden
    >
      <h2 id="playlistName"></h2>
      <p id="playlistCount"></p>
    </section>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    >
      Loading playlist…
    </div>

    <section
      id="playlistList"
      class="playlist-list"
      aria-label="Playlist media"
    ></section>
  </main>

  <footer>
    Media remains hosted by Apple, YouTube, and its respective
    providers.
  </footer>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      doc,
      getDoc,
      getFirestore
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const statusElement = document.getElementById("status");
    const headerElement = document.getElementById("playlistHeader");
    const nameElement = document.getElementById("playlistName");
    const countElement = document.getElementById("playlistCount");
    const listElement = document.getElementById("playlistList");

    const showStatus = (message, isError = false) => {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
      statusElement.hidden = false;
    };

    const hideStatus = () => {
      statusElement.hidden = true;
    };

    const getPlaylistId = () => {
      const query = new URLSearchParams(window.location.search);
      return query.get("playlist");
    };

    const getFirebaseConfig = async () => {
      const response = await fetch("/__/firebase/init.json");

      if (!response.ok) {
        throw new Error(
          `Firebase configuration request failed: ${response.status}`
        );
      }

      return response.json();
    };

    const getMediaLabel = (mediaType) => {
      switch (mediaType) {
        case "song":
          return "Song";

        case "audiobook":
          return "Audiobook";

        case "podcast":
          return "Podcast";

        case "podcastEpisode":
          return "Podcast episode";

        case "video":
          return "Video";

        default:
          return "Media";
      }
    };

    const getSourceLabel = (mediaType) => {
      switch (mediaType) {
        case "song":
          return "Apple Music";

        case "audiobook":
          return "Apple Books";

        case "podcast":
        case "podcastEpisode":
          return "Apple Podcasts";

        case "video":
          return "YouTube";

        default:
          return "View";
      }
    };

    const getSafeUrl = (value) => {
      if (typeof value !== "string" || !value.trim()) {
        return null;
      }

      try {
        const url = new URL(value);

        if (url.protocol !== "https:" && url.protocol !== "http:") {
          return null;
        }

        return url.toString();
      } catch {
        return null;
      }
    };

    const createArtwork = (item) => {
      const artworkUrl = getSafeUrl(item.artworkUrl);

      if (!artworkUrl) {
        const placeholder = document.createElement("div");
        placeholder.className = "artwork-placeholder";
        placeholder.setAttribute("aria-hidden", "true");
        placeholder.textContent = "♪";
        return placeholder;
      }

      const image = document.createElement("img");
      image.className = "artwork";
      image.src = artworkUrl;
      image.alt = "";
      image.loading = "lazy";
      image.referrerPolicy = "no-referrer";

      image.addEventListener("error", () => {
        const placeholder = document.createElement("div");
        placeholder.className = "artwork-placeholder";
        placeholder.setAttribute("aria-hidden", "true");
        placeholder.textContent = "♪";
        image.replaceWith(placeholder);
      });

      return image;
    };

    const createMediaCard = (item) => {
      const card = document.createElement("article");
      card.className = "media-card";

      card.appendChild(createArtwork(item));

      const details = document.createElement("div");
      details.className = "media-details";

      const title = document.createElement("h3");
      title.className = "media-title";
      title.textContent = item.title || "Untitled media";

      const creator = document.createElement("p");
      creator.className = "media-creator";
      creator.textContent = item.creator || "Unknown creator";

      const mediaType = document.createElement("span");
      mediaType.className = "media-type";
      mediaType.textContent = getMediaLabel(item.mediaType);

      details.append(title, creator, mediaType);
      card.appendChild(details);

      const externalUrl = getSafeUrl(item.externalUrl);

      if (externalUrl) {
        const link = document.createElement("a");
        link.className = "open-link";
        link.href = externalUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = `Open in ${getSourceLabel(item.mediaType)}`;
        link.setAttribute(
          "aria-label",
          `Open ${item.title || "media"} in ${getSourceLabel(
            item.mediaType
          )}`
        );

        card.appendChild(link);
      } else {
        const unavailable = document.createElement("span");
        unavailable.className = "unavailable";
        unavailable.textContent = "Link unavailable";
        card.appendChild(unavailable);
      }

      return card;
    };

    const loadPlaylist = async () => {
      const playlistId = getPlaylistId();

      if (!playlistId) {
        document.title = "Shared PlayList";
        showStatus(
          "This playlist link is incomplete. Ask the sender for a new link.",
          true
        );
        return;
      }

      try {
        const firebaseConfig = await getFirebaseConfig();
        const app = initializeApp(firebaseConfig);
        const database = getFirestore(app);

        const playlistReference = doc(
          database,
          "sharedPlaylists",
          playlistId
        );

        const playlistSnapshot = await getDoc(playlistReference);

        if (!playlistSnapshot.exists()) {
          showStatus(
            "This playlist could not be found. It may have been removed.",
            true
          );
          return;
        }

        const playlist = playlistSnapshot.data();

        if (playlist.published !== true) {
          showStatus(
            "This playlist is not currently available publicly.",
            true
          );
          return;
        }

        const playlistName =
          typeof playlist.name === "string" && playlist.name.trim()
            ? playlist.name.trim()
            : "Shared Playlist";

        const playlistItems = Array.isArray(playlist.items)
          ? playlist.items
          : [];

        document.title = `${playlistName} | PlayList`;
        nameElement.textContent = playlistName;
        countElement.textContent =
          playlistItems.length === 1
            ? "1 media item"
            : `${playlistItems.length} media items`;

        headerElement.hidden = false;
        listElement.replaceChildren();

        if (playlistItems.length === 0) {
          showStatus("This shared playlist is currently empty.");
          return;
        }

        const fragment = document.createDocumentFragment();

        playlistItems.forEach((item) => {
          fragment.appendChild(createMediaCard(item));
        });

        listElement.appendChild(fragment);
        hideStatus();
      } catch (error) {
        console.error("Failed to load shared playlist:", error);

        showStatus(
          "This playlist could not be loaded. Please try again later.",
          true
        );
      }
    };

    void loadPlaylist();
  </script>
</body>
</html>
